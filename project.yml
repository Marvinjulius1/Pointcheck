# XcodeGen project definition – run `xcodegen` in this folder to create Pointcheck.xcodeproj.
name: Pointcheck

options:
  bundleIdPrefix: com.marvinjulius
  developmentLanguage: de
  deploymentTarget:
    watchOS: "10.0"
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: S8WH8LBMU2        # Marvin Julius (Personal Team)

packages:
  PadelScoring:
    path: Packages/PadelScoring
  # Official Supabase client (accounts, database) – iPhone app only.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  Pointcheck:
    type: application
    platform: watchOS
    sources:
      - path: PointcheckWatch
    dependencies:
      - package: PadelScoring
        product: PadelScoring
      - package: PadelScoring
        product: PadelStats
      - sdk: HealthKit.framework
      - target: PointcheckWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marvinjulius.pointcheck.watchkitapp
        PRODUCT_NAME: Pointcheck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: PointcheckWatch/Info.plist
      properties:
        CFBundleDisplayName: Pointcheck
        CFBundleDevelopmentRegion: de
        WKApplication: true
        # Companion of the iPhone app, but fully usable without it.
        WKCompanionAppBundleIdentifier: com.marvinjulius.pointcheck
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: Pointcheck liest Herzfrequenz und Kalorien, um dein Padel-Match als Training aufzuzeichnen.
        NSHealthUpdateUsageDescription: Pointcheck speichert deine Padel-Matches als Training in Health.
    entitlements:
      path: PointcheckWatch/Pointcheck.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  PointcheckWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: PointcheckWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marvinjulius.pointcheck.watchkitapp.widget
        PRODUCT_NAME: PointcheckWidget
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: PointcheckWidget/Info.plist
      properties:
        CFBundleDisplayName: Pointcheck
        CFBundleDevelopmentRegion: de
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  PointcheckPhone:
    type: application
    platform: iOS
    sources:
      - path: PointcheckPhone
      - path: Shared
    dependencies:
      - package: PadelScoring
        product: PadelStats
      - package: Supabase
        product: Supabase
      - sdk: HealthKit.framework
      - target: PointcheckPhoneWidget
      # Embeds the watch app ("Embed Watch Content").
      - target: Pointcheck
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marvinjulius.pointcheck
        PRODUCT_NAME: Pointcheck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: PointcheckPhone/Info.plist
      properties:
        CFBundleDisplayName: Pointcheck
        CFBundleDevelopmentRegion: de
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # pointcheck://login – the sign-in link in the e-mail opens the app.
        CFBundleURLTypes:
          - CFBundleURLName: com.marvinjulius.pointcheck
            CFBundleURLSchemes:
              - pointcheck
        NSHealthShareUsageDescription: Pointcheck zeigt Herzfrequenz und Kalorien deiner Padel-Matches, die deine Apple Watch aufgezeichnet hat.
        NSCalendarsWriteOnlyAccessUsageDescription: Pointcheck trägt zugesagte Revanchen und Matches in deinen Kalender ein.
    entitlements:
      path: PointcheckPhone/Pointcheck.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.marvinjulius.pointcheck

  PointcheckPhoneWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PointcheckPhoneWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marvinjulius.pointcheck.widget
        PRODUCT_NAME: PointcheckPhoneWidget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: PointcheckPhoneWidget/Info.plist
      properties:
        CFBundleDisplayName: Pointcheck
        CFBundleDevelopmentRegion: de
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PointcheckPhoneWidget/PointcheckPhoneWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.marvinjulius.pointcheck

schemes:
  PointcheckPhone:
    build:
      targets:
        PointcheckPhone: all
    run:
      config: Debug
    archive:
      config: Release
  Pointcheck:
    build:
      targets:
        Pointcheck: all
    run:
      config: Debug
    archive:
      config: Release
